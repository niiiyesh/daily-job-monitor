name: Test Telegram connection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  telegram-test:
    runs-on: ubuntu-latest
    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Send test alert with existing monitor code
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          from monitor import send_telegram

          token = os.environ.get("TELEGRAM_BOT_TOKEN", "")
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "")
          if not token or not chat_id:
              raise SystemExit("Missing TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID repository secret")

          test_job = {
              "title": "TEST ONLY - GitHub Actions Telegram connection",
              "location": "Test notification, not an actual vacancy",
              "url": "https://github.com/niiyesh/daily-job-monitor",
          }
          try:
              send_telegram(test_job, "European Job Monitor", token, chat_id)
          except Exception as exc:
              raise SystemExit(f"Telegram test failed: {type(exc).__name__}; check secrets and bot chat") from None
          print("Telegram test notification delivered successfully")
          PY
